<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card UI design</title>
    <!-- CSS -->
     <link rel="stylesheet" href="style.css"/>
    <!-- boxicons css -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="image.jpg" alt="" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">Gourav</span>
            <span class="goal">Data Analyst</span>
        </div>

        <div class="media-button">
            <a href="#" class="link"><i class='bx bxl-facebook-circle'></i></a>
            <a href="#" class="link"><i class='bx bxl-instagram-alt' ></i></a>
            <a href="#" class="link"><i class='bx bxl-twitter' ></i></a>
            <a href="#" class="link"><i class='bx bxl-youtube' ></i></a>
        </div>
        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Message</button>
        </div>

        <div class="analytics">
            <div class="data">
                <i class='bx bxs-heart' ></i>
                <span class="number">60k</span>
            </div>
            <div class="data">
                <i class='bx bxs-message-rounded-dots' ></i>
                <span class="number">60k</span>
            </div>
            <div class="data">
                <i class='bx bxs-share-alt' ></i>
                <span class="number">60k</span>
            </div>
        </div>
    </div>
      
</body>
</html>
