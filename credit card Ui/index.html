<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit card UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <header>
            <span class="logo">
                <img src="Screenshot 2026-06-21 103937.png" alt="">
                <h5>Master Card</h5>
            </span>
            
           <img src="chip.png" alt="" class="chip"> 
        </header>

        <div class="details">
            <div class="name-num">
                <h6>Card Number</h6>
                <h5 class="num">8596 1452 4652 4875</h5>
                <h5 class="name">Gourav Kumar</h5>

            </div>
            <div class="valid">
                <h6>Valid Thru</h6>
                <h5>05/26</h5>
            </div>
        </div>
    </div>
</body>
</html>
